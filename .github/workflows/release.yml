# =============================================================================
#  Release —— 推一个 `v*` 标签即发布
#
#  流程：
#    1. 校验标签与 `src-tauri/tauri.conf.json` 的版本号一致
#    2. 在 windows-latest 上编译并打出 NSIS 安装包
#    3. 建 GitHub Release，把 `.exe` 传上去
#
#  ## 为什么要先校验标签
#
#  版本号写在三处（`Cargo.toml` / `tauri.conf.json` / `package.json`），
#  安装包文件名也由它生成。标签打错**不会报错** —— 只会安静地发一个
#  「标签名对不上内容」的版本。而应用内的「检查更新」正是拿标签去比对的
#  （`releases/latest` → `tag_name` 去掉 `v` 后与 `CARGO_PKG_VERSION` 比大小），
#  标签错了就会长期误报「已是最新」。
#  改版本号请一律用 `./scripts/bump-version.sh`。
#
#  ## 为什么显式指定 `--store-dir`
#
#  仓库里的 `.npmrc` 把 store-dir 指到了开发机的绝对路径（本机并发写盘问题的绕法），
#  runner 上没有那个盘，必须在这里覆盖成 runner 自己的临时目录。
#
#  ## 🔴 不要发 draft
#
#  应用内的「检查更新」读的是 `repos/<owner>/<repo>/releases/latest` ——
#  draft 不算 latest，发了草稿等于没发。
#
#  ## 资产名与 `target/`
#
#  workspace 的 `Cargo.toml` 在仓库根目录，所以 cargo target 就是根下的 `target/`；
#  NSIS 产物落在 `target/release/bundle/nsis/`，文件名形如
#  `AI全能计算器_1.0.11_x64-setup.exe`。
#  更新检查按后缀取资产（`.exe` / `.msi` 优先），中文文件名不影响。
# =============================================================================

name: Release

on:
  push:
    tags: ['v*']
  # 允许手动补发（标签已存在但发布失败、或需要重跑时）
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的标签，如 v1.0.11（必须已存在）'
        required: true
        type: string

# `softprops/action-gh-release` 要建 Release，需要写权限
permissions:
  contents: write

# 同一个标签重复触发时，让新的那次接管
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  release:
    name: 构建并发布（NSIS）
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      # 标签与版本号必须一致 —— 这是「发错版本」的唯一防线
      - name: 校验标签与版本号
        shell: pwsh
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          $ver = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          if ($env:TAG -ne "v$ver") {
            Write-Error "标签 $env:TAG 与 tauri.conf.json 的版本 v$ver 不一致。改版本号请用 ./scripts/bump-version.sh"
            exit 1
          }
          Write-Host "版本校验通过：$env:TAG"

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'

      # 必须 pnpm 12：`pnpm-workspace.yaml` 的 `allowBuilds` 是 pnpm 12 的键名，
      # 用 10 会继续报 `ERR_PNPM_IGNORED_BUILDS` 而装不上依赖。
      - uses: pnpm/action-setup@v4
        with:
          version: 12

      # ⚠️ 刻意**不加** `cache: pnpm`：setup-node 的缓存 post 步骤靠
      #    `pnpm store path` 找 store，而它**不读项目级 `.npmrc`**，返回的是
      #    盘根默认目录；我们又用 `--store-dir` 把包装进了 runner 临时目录 ——
      #    两者对不上，post 步骤会因「路径不存在」失败并把 job 判红
      #    （首次发布实测如此，安装包其实已经发成功了）。
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 安装依赖
        run: pnpm install --frozen-lockfile --store-dir "${{ runner.temp }}/pnpm-store"

      # `tauri build` 会先跑 beforeBuildCommand（`pnpm build`：类型检查 + vite 构建），
      # 再编译 Rust 并调用 bundler 产出 NSIS 安装包。
      - name: 构建安装包
        run: pnpm tauri build

      # 🔴 必须换成 ASCII 文件名再上传
      #
      # Tauri 产出的原始名是 `AI全能计算器_1.0.11_x64-setup.exe`（本地构建正常）。
      # 但 GitHub 的发布资产接口会把文件名里的非 ASCII 字符转义掉 ——
      # 首次发布实测：`AI全能计算器_1.0.11_x64-setup.exe` 传上去变成了
      # `AI._1.0.11_x64-setup.exe`（中文整段被吃成一个点），下载页上很难看。
      #
      # 安装包**内部**的产品名仍是中文（NSIS 显示名、开始菜单、控制面板都不受影响），
      # 这里只改文件名。Release 的**标题**也照旧用中文（标题不受影响）。
      - name: 规整安装包文件名
        shell: pwsh
        run: |
          $ver = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          Write-Host 'Tauri 构建产物：'
          Get-ChildItem target/release/bundle/nsis/*.exe | ForEach-Object { Write-Host ('  ' + $_.Name) }
          $src = Get-ChildItem target/release/bundle/nsis/*.exe | Select-Object -First 1
          $dst = Join-Path $src.DirectoryName "AI-Calculator_${ver}_x64-setup.exe"
          Copy-Item -LiteralPath $src.FullName -Destination $dst -Force
          Write-Host ('上传用文件名：' + (Split-Path $dst -Leaf))

      # 重跑、或改了文件名规则之后，旧的 `.exe` 会留在同一个 Release 里 ——
      # 一个发布挂两个安装包，用户容易下错。只保留本次要传的那一个。
      - name: 清理该 Release 下的旧安装包
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          $ver = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $keep = "AI-Calculator_${ver}_x64-setup.exe"
          $json = gh release view $env:TAG --json assets 2>$null
          if ($LASTEXITCODE -eq 0 -and $json) {
            $names = ($json | ConvertFrom-Json).assets |
              Where-Object { $_.name -like '*.exe' } | ForEach-Object { $_.name }
            foreach ($n in $names) {
              if ($n -ne $keep) {
                Write-Host "删除旧安装包：$n"
                gh release delete-asset $env:TAG $n --yes
              }
            }
          } else {
            Write-Host '该 Release 尚不存在，无需清理'
          }
          exit 0

      - name: 发布到 Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          # 标题用中文（标题不经过文件名转义），下载页上一眼能认出是哪个应用
          name: AI全能计算器 ${{ inputs.tag || github.ref_name }}
          files: target/release/bundle/nsis/AI-Calculator_*.exe
          # 资产没匹配上就直接失败，别发一个没有安装包的 Release
          fail_on_unmatched_files: true
          generate_release_notes: true
          draft: false
