# =============================================================================
#  Release —— 推一个 `v*` 标签即发布
#
#  流程：
#    1. 校验标签与 `src-tauri/tauri.conf.json` 的版本号一致
#    2. 在 windows-latest 上编译并打出 NSIS 安装包
#    3. 建 GitHub Release，把 `.exe` 传上去
#
#  ## 为什么要先校验标签
#
#  版本号写在三处（`Cargo.toml` / `tauri.conf.json` / `package.json`），
#  安装包文件名也由它生成。标签打错**不会报错** —— 只会安静地发一个
#  「标签名对不上内容」的版本。而应用内的「检查更新」正是拿标签去比对的
#  （`releases/latest` → `tag_name` 去掉 `v` 后与 `CARGO_PKG_VERSION` 比大小），
#  标签错了就会长期误报「已是最新」。
#  改版本号请一律用 `./scripts/bump-version.sh`。
#
#  ## 为什么显式指定 `--store-dir`
#
#  仓库里的 `.npmrc` 把 store-dir 指到了开发机的绝对路径（本机并发写盘问题的绕法），
#  runner 上没有那个盘，必须在这里覆盖成 runner 自己的临时目录。
#
#  ## 🔴 不要发 draft
#
#  应用内的「检查更新」读的是 `repos/<owner>/<repo>/releases/latest` ——
#  draft 不算 latest，发了草稿等于没发。
#
#  ## 资产名与 `target/`
#
#  workspace 的 `Cargo.toml` 在仓库根目录，所以 cargo target 就是根下的 `target/`；
#  NSIS 产物落在 `target/release/bundle/nsis/`，文件名形如
#  `AI全能计算器_1.0.11_x64-setup.exe`。
#  更新检查按后缀取资产（`.exe` / `.msi` 优先），中文文件名不影响。
# =============================================================================

name: Release

on:
  push:
    tags: ['v*']
  # 允许手动补发（标签已存在但发布失败、或需要重跑时）
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的标签，如 v1.0.11（必须已存在）'
        required: true
        type: string

# `softprops/action-gh-release` 要建 Release，需要写权限
permissions:
  contents: write

# 同一个标签重复触发时，让新的那次接管
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  release:
    name: 构建并发布（NSIS）
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      # 标签与版本号必须一致 —— 这是「发错版本」的唯一防线
      - name: 校验标签与版本号
        shell: pwsh
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          $ver = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          if ($env:TAG -ne "v$ver") {
            Write-Error "标签 $env:TAG 与 tauri.conf.json 的版本 v$ver 不一致。改版本号请用 ./scripts/bump-version.sh"
            exit 1
          }
          Write-Host "版本校验通过：$env:TAG"

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'

      # 必须 pnpm 12：`pnpm-workspace.yaml` 的 `allowBuilds` 是 pnpm 12 的键名，
      # 用 10 会继续报 `ERR_PNPM_IGNORED_BUILDS` 而装不上依赖。
      - uses: pnpm/action-setup@v4
        with:
          version: 12

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile --store-dir "${{ runner.temp }}/pnpm-store"

      # `tauri build` 会先跑 beforeBuildCommand（`pnpm build`：类型检查 + vite 构建），
      # 再编译 Rust 并调用 bundler 产出 NSIS 安装包。
      - name: 构建安装包
        run: pnpm tauri build

      - name: 发布到 Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: ${{ inputs.tag || github.ref_name }}
          files: target/release/bundle/nsis/*.exe
          # 资产没匹配上就直接失败，别发一个没有安装包的 Release
          fail_on_unmatched_files: true
          generate_release_notes: true
          draft: false
