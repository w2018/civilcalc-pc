[package]
name = "civilcalc-report"
description = "AI全能计算器 PC 端报告生成（从 Android :core/report 移植，POI → docx-rs）"
version.workspace = true
edition.workspace = true
license.workspace = true

# ⚠️ 硬约束（ADR-002）：不得依赖 tauri。
# 消费 civilcalc-core 的 schema 类型（TemplateSection 等），但不反向依赖。

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
chrono.workspace = true
docx-rs.workspace = true
civilcalc-core.workspace = true

[dev-dependencies]
# 测试要解包生成的 .docx（ZIP）取出 `word/document.xml` 断言正文内容。
#
# ⚠️ 版本与 features **必须**和 `docx-rs` 的声明完全一致
# （`zip 8.6.0` + `default-features = false` + `deflate`）：
# 多开一个 feature 就会引入缓存里没有的 crate，本机离线构建直接失败。
# `docx-rs` 未导出自己的 `zip`（`mod zipper` 是私有的），只能这样复用同一份依赖。
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
